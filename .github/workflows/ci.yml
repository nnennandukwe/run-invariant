name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install pinned dependencies
        run: npm ci

      - name: Check out pinned ThreadLoop corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nnennandukwe/threadloop
          ref: 49fbf87e8a99f8490262f3ab6405e0b4b363d02f
          path: .threadloop-corpus
          persist-credentials: false

      - name: Run tests
        run: npm test

      - name: Exercise ThreadLoop process integration
        run: npm run test:threadloop
        env:
          THREADLOOP_CHECKOUT: ${{ github.workspace }}/.threadloop-corpus

      - name: Reproduce committed evidence
        run: npm run check
