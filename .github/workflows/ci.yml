name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install pinned dependencies
        run: npm ci

      - name: Check out pinned ThreadLoop corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nnennandukwe/threadloop
          ref: fde510deca780c7cada8a2e461bd15af0fe4ae88
          path: .threadloop-corpus
          persist-credentials: false

      - name: Run tests
        run: npm test

      - name: Exercise ThreadLoop process integration
        run: npm run test:threadloop
        env:
          THREADLOOP_CHECKOUT: ${{ github.workspace }}/.threadloop-corpus

      - name: Check out pinned GAAP runtime subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nnennandukwe/governed-agent-autonomy-patterns
          ref: 50178c68d22d610a5f780ac088436f549f5588a2
          path: .gaap-runtime
          persist-credentials: false

      - name: Validate runtime manifest and pinned contract sources
        run: |
          npm run check:runtime
          node scripts/check-runtime-reference.js .gaap-runtime

      - name: Build opaque GAAP runtime subject
        run: cargo build --locked --manifest-path .gaap-runtime/Cargo.toml

      - name: Exercise runtime, negative paths and unsafe subjects
        run: npm run test:runtime
        env:
          GAAP_BINARY: ${{ github.workspace }}/.gaap-runtime/target/debug/gaap

      - name: Reproduce committed evidence
        run: npm run check
